
<h2>Extrato Bancário</h2>


<table>
  <thead>
    <tr>
      <th>Tipo</th>
      <th>Valor</th>
      <th>Data</th>
    </tr>
  </thead>

  <tbody>
    @for (mov of movimentacoes; track $index) {
      <tr>
        <td>{{ mov.tipo }}</td>
        <td>{{ mov.valor | currency:'BRL' }}</td>
        <td>{{ mov.data | date:'dd/MM/yyyy HH:mm' }}</td>
      </tr>
    } @empty {
      <tr>
        <td colspan="3">Nenhuma movimentação realizada.</td>
      </tr>
    }
  </tbody>
</table>
